<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identify — Step Card Mockup v4</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a2520;
    --ink2: #5a4e44;
    --ink3: #9a8e84;
    --accent: #8b7355;
    --accent2: #c8a96e;
    --border: rgba(139,115,85,0.18);
    --white: #fff;
    --bg: #f7f4f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Jost', sans-serif; color: var(--ink); padding: 2rem; }

  .demo-label { text-align:center; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink3); margin-bottom:1.5rem; }

  .demo-controls { max-width:680px; margin:0 auto 2rem; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .demo-btn { font-size:11px; padding:6px 13px; border:0.5px solid var(--border); border-radius:6px; background:var(--white); cursor:pointer; font-family:'Jost',sans-serif; color:var(--ink2); letter-spacing:0.03em; }
  .demo-btn:hover { border-color:var(--accent2); color:var(--accent); }
  .demo-btn.on { background:var(--ink); color:var(--white); border-color:var(--ink); }

  .id-wrap { max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }

  .step-card { background:var(--white); border:0.5px solid var(--border); border-radius:12px; overflow:hidden; }
  .step-card.answered { border-left:3px solid var(--accent2); }
  .step-card.active { box-shadow:0 6px 24px rgba(42,37,32,0.08); border-color:rgba(200,169,110,0.4); }

  /* Answered */
  .answered-row { display:flex; align-items:center; gap:12px; padding:0.8rem 1.4rem; }
  .answered-num { font-family:Georgia,serif; font-size:13px; color:var(--accent2); flex-shrink:0; }
  .answered-name { font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink3); flex:1; }
  .answered-chip { background:#f1e8d8; color:var(--accent); font-size:11.5px; padding:3px 12px; border-radius:20px; font-weight:500; border:0.5px solid rgba(200,169,110,0.4); white-space:nowrap; }
  .answered-chip.skipped { background:transparent; color:var(--ink3); border-color:var(--border); font-style:italic; }
  .answered-edit { font-size:11px; color:var(--ink3); background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:2px; padding:0; font-family:'Jost',sans-serif; flex-shrink:0; }
  .answered-edit:hover { color:var(--accent); }

  /* Active */
  .active-inner { padding:1.5rem 1.75rem; }
  .active-header { display:flex; align-items:baseline; gap:10px; margin-bottom:1.1rem; }
  .active-num { font-family:Georgia,serif; font-size:22px; color:var(--accent2); flex-shrink:0; line-height:1; }
  .active-question { font-size:17px; font-weight:400; color:var(--ink); line-height:1.35; }

  /* Tooltip */
  .tip-btn { width:14px; height:14px; border-radius:50%; border:1px solid var(--accent2); background:transparent; color:var(--accent2); font-size:8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; margin-left:5px; vertical-align:middle; font-family:'Jost',sans-serif; flex-shrink:0; transition:all 0.15s; line-height:1; }
  .tip-btn:hover { background:var(--accent2); color:var(--white); }

  /* Color */
  .color-grid { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding:0.25rem 0; }
  .color-swatch { width:40px; height:40px; border-radius:50%; border:2.5px solid transparent; cursor:pointer; transition:transform 0.15s; }
  .color-swatch:hover { transform:scale(1.13); }
  .color-swatch.active { box-shadow:0 0 0 2px var(--white),0 0 0 4.5px var(--ink); }

  /* Pills + skip inline */
  .pills-row { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .pill { font-size:12.5px; padding:7px 17px; border:0.5px solid var(--border); border-radius:20px; background:transparent; cursor:pointer; color:var(--ink2); font-family:'Jost',sans-serif; transition:all 0.15s; }
  .pill:hover { border-color:var(--accent2); color:var(--accent); background:#fdf8f2; }
  .pill.active { background:var(--ink); color:var(--white); border-color:var(--ink); }
  .skip-pill { font-size:11.5px; padding:7px 14px; border:none; border-radius:20px; background:transparent; cursor:pointer; color:var(--ink3); font-family:'Jost',sans-serif; transition:all 0.15s; text-decoration:underline; text-underline-offset:2px; white-space:nowrap; }
  .skip-pill:hover { color:var(--accent); }

  /* Result */
  .result-card { background:var(--white); border:0.5px solid rgba(200,169,110,0.45); border-radius:12px; padding:1.25rem 1.75rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .result-count { font-family:Georgia,serif; font-size:20px; color:var(--ink); }
  .result-sub { font-size:12px; color:var(--ink3); margin-top:3px; }
  .result-cta { background:var(--accent); color:var(--white); border:none; border-radius:8px; padding:10px 22px; font-family:'Jost',sans-serif; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; white-space:nowrap; }

  @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .slide-in { animation:slideIn 0.28s cubic-bezier(0.22,1,0.36,1) both; }
</style>
</head>
<body>

<p class="demo-label">Identify — Step Card Mockup v4</p>

<div class="demo-controls">
  <button class="demo-btn on" id="btn-1" onclick="go(1)">① Color</button>
  <button class="demo-btn"   id="btn-2" onclick="go(2)">② Transparency</button>
  <button class="demo-btn"   id="btn-3" onclick="go(3)">③ Luster</button>
  <button class="demo-btn"   id="btn-4" onclick="go(4)">④ Hardness</button>
  <button class="demo-btn"   id="btn-5" onclick="go(5)">⑤ Weight</button>
  <button class="demo-btn"   id="btn-6" onclick="go(6)">✓ Results</button>
</div>

<div class="id-wrap" id="wrap"></div>

<script>
const COLORS = [
  {label:'Red',hex:'#c0392b'},{label:'Orange',hex:'#d4671e'},{label:'Yellow',hex:'#c9a227'},
  {label:'Green',hex:'#2e7d4f'},{label:'Pink',hex:'#d4607a'},{label:'Blue',hex:'#2a6fa8'},
  {label:'Purple',hex:'#7b5ea7'},{label:'White',hex:'#e0dbd4',outline:true},
  {label:'Black',hex:'#2a2520'},{label:'Brown',hex:'#8b6340'},{label:'Gray',hex:'#8a9499'},
];

const STEPS = [
  { key:'color', name:'Color', question:'What color is it?', tip:null, skippable:false, type:'color' },
  { key:'trans', name:'Transparency', question:'Transparency: Can you see through it?', tip:'Hold the stone up to a window or light. Fully clear = transparent; glows or lets light through = translucent; no light passes at all = opaque.', skippable:true, type:'pills', options:['Clear like glass','Light gets through','Fully solid'] },
  { key:'luster', name:'Luster', question:'Luster: How does the surface look in light?', tip:'Glassy = bright mirror-like shine; silky/pearly = soft satiny sheen; metallic = catches light like metal; earthy = matte with no shine; iridescent = shifts color as you tilt.', skippable:true, type:'pills', options:['Glassy & bright','Silky or pearly','Metallic','Dull or earthy','Iridescent'] },
  { key:'hard', name:'Hardness', question:'Hardness: How tough is it?', tip:'Find a hidden spot and try to scratch it with your fingernail. Scratches easily = delicate (Mohs ~2–3). Fingernail leaves no mark = everyday. Nothing scratches it = very tough (Mohs 7+).', skippable:true, type:'pills', options:['Scratches easily','Holds up well','Very scratch-proof'] },
  { key:'heft', name:'Weight', question:'Weight: How heavy does it feel for its size?', tip:'Compare to a similarly-sized piece of glass in your hand. Most stones feel about right — but some (malachite, hematite) feel noticeably heavier, and some (selenite, howlite) feel surprisingly light.', skippable:true, type:'pills', options:['Lighter than expected','About right','Heavier than expected'] },
];

const DEMO_ANSWERS = ['Green','Fully solid','Glassy & bright','Holds up well','About right'];
const NUMS = ['①','②','③','④','⑤'];
let step = 1;

function go(n){ step=n; document.querySelectorAll('.demo-btn').forEach(b=>b.classList.remove('on')); document.getElementById('btn-'+n).classList.add('on'); render(); }

function render(){
  const wrap=document.getElementById('wrap'); wrap.innerHTML='';
  for(let i=0;i<step-1;i++) wrap.appendChild(makeAnswered(i));
  if(step<=STEPS.length) wrap.appendChild(makeActive(step-1));
  else wrap.appendChild(makeResult());
}

function makeAnswered(i){
  const s=STEPS[i], isSkipped=(i===2);
  const card=document.createElement('div'); card.className='step-card answered';
  card.innerHTML=`<div class="answered-row"><span class="answered-num">${NUMS[i]}</span><span class="answered-name">${s.name}</span><span class="answered-chip${isSkipped?' skipped':''}">${isSkipped?'Skipped':DEMO_ANSWERS[i]}</span><button class="answered-edit">change</button></div>`;
  return card;
}

function makeActive(i){
  const s=STEPS[i];
  const tipHtml=s.tip?`<button class="tip-btn" title="${s.tip}">?</button>`:'';
  let bodyHtml='';
  if(s.type==='color'){
    bodyHtml=`<div class="color-grid">${COLORS.map((c,ci)=>`<button class="color-swatch${ci===3?' active':''}" style="background:${c.hex};${c.outline?'border-color:#ccc':''}" title="${c.label}" onclick="go(${i+2})"></button>`).join('')}</div>`;
  } else {
    const pillsHtml=s.options.map(o=>`<button class="pill" onclick="go(${i+2})">${o}</button>`).join('');
    const skipHtml=s.skippable?`<button class="skip-pill" onclick="go(${i+2})">Skip →</button>`:'';
    bodyHtml=`<div class="pills-row">${pillsHtml}${skipHtml}</div>`;
  }
  const card=document.createElement('div'); card.className='step-card active slide-in';
  card.innerHTML=`<div class="active-inner"><div class="active-header"><span class="active-num">${NUMS[i]}</span><span class="active-question">${s.question}${tipHtml}</span></div>${bodyHtml}</div>`;
  return card;
}

function makeResult(){
  const card=document.createElement('div'); card.className='result-card slide-in';
  card.innerHTML=`<div><div class="result-count">14 possible matches</div><div class="result-sub">Based on your selections</div></div><button class="result-cta">See matches →</button>`;
  return card;
}

render();
</script>
</body>
</html>
